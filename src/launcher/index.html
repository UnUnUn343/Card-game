<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Pokemon Battle</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<header class="titlebar">
  <div class="brand">
    <span class="leds" aria-hidden="true"><i></i><i></i><i></i></span>
    <svg class="brand-icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#emblem"/></svg><span data-t="title"></span>
  </div>
  <div class="titlebar-actions">
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="uk">UA</button><button data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="open-settings" aria-label="Settings" data-t-title="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <!-- the device: red shell, lens (busy while checking / downloading), cream bezel, data screen -->
  <section class="dex">
    <div class="dex-top" aria-hidden="true">
      <div class="lens" id="lens"></div>
      <div class="dex-leds"><i></i><i></i><i></i></div>
      <div class="dex-grill"><i></i><i></i><i></i></div>
    </div>
    <div class="bezel">
      <div class="bezel-dots" aria-hidden="true"><i></i><i></i></div>
      <div class="screen">
        <div class="scan" aria-hidden="true"></div>
        <div class="brandrow">
          <svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><use href="#emblem"/></svg>
          <div><h1 data-t="title"></h1><p class="subtitle" data-t="subtitle"></p></div>
        </div>
        <div class="dexhead"><span data-t="dexTitle"></span><span id="dex-no"></span></div>
        <div class="dexcard" id="dex-card"></div>
        <div class="chips">
          <span class="chip"><span data-t="gameVersion"></span> <b id="chip-game">—</b></span>
          <span class="chip"><span data-t="launcherVersion"></span> <b id="chip-launcher">—</b></span>
        </div>
      </div>
    </div>
  </section>

  <!-- a steel data panel with tabs -->
  <aside class="news">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-news" data-tab="news" aria-selected="true" class="on" data-t="tabNews"></button>
      <button role="tab" id="tab-live" data-tab="live" aria-selected="false"><span data-t="tabLive"></span> <span class="cnt" id="live-count" hidden></span></button>
      <button role="tab" id="tab-tour" data-tab="tour" aria-selected="false" data-t="tabTour"></button>
    </div>
    <div class="pane" data-pane="news" role="tabpanel">
      <div class="news-head" id="news-head"></div>
      <div class="news-body" id="news-body"></div>
    </div>
    <div class="pane" data-pane="live" role="tabpanel" hidden><div class="pane-body" id="live-body"></div></div>
    <div class="pane" data-pane="tour" role="tabpanel" hidden><div class="pane-body" id="tour-body"></div></div>
  </aside>
</main>

<footer class="dock">
  <div class="launcher-update" id="launcher-update" hidden>
    <span id="lu-text"></span>
    <button class="btn small" id="lu-btn"></button>
  </div>
  <div class="dock-row">
    <div class="status">
      <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text"></span><button class="link" id="status-action" hidden></button></div>
      <div class="status-sub" id="status-sub"></div>
      <div class="progress" id="progress" hidden><i id="progress-fill"></i></div>
    </div>
    <div class="play-wrap">
      <button class="play" id="play"><span class="play-label" id="play-label"></span><span class="play-ver" id="play-ver"></span></button>
      <button class="link small" id="play-old" hidden></button>
    </div>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 data-t="settings"></h2>
    <button class="icon-btn" id="close-settings" data-t-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.71 12 12.01l-6.3-6.3-1.41 1.41 6.3 6.3-6.3 6.3 1.41 1.41 6.3-6.3 6.3 6.3 1.41-1.41-6.3-6.3 6.3-6.3z"/></svg></button>
  </div>
  <div class="drawer-body">
    <section>
      <h3 data-t="s_updates"></h3>
      <label class="toggle"><input type="checkbox" id="set-autoDownload"><span></span><em data-t="s_autoDownload"></em></label>
      <div class="row"><button class="btn small" id="check-now" data-t="s_checkNow"></button><span class="muted" id="last-check"></span></div>
      <div class="field">
        <div class="field-label" data-t="s_source"></div>
        <div class="source-view" id="source-view"><code id="source-text"></code><button class="link" id="source-edit" data-t="s_change"></button></div>
        <div class="source-edit" id="source-form" hidden>
          <input id="source-input" spellcheck="false" autocomplete="off">
          <div class="row"><button class="btn small" id="source-save" data-t="s_save"></button><button class="link" id="source-reset" data-t="s_reset"></button></div>
          <div class="muted" data-t="s_sourceHint"></div>
        </div>
      </div>
    </section>
    <section>
      <h3 data-t="s_game"></h3>
      <label class="toggle"><input type="checkbox" id="set-startFullscreen"><span></span><em data-t="s_fullscreen"></em></label>
      <label class="toggle"><input type="checkbox" id="set-openGameDirectly"><span></span><em data-t="s_openDirectly"></em></label>
      <div class="muted" data-t="s_keys"></div>
    </section>
    <section>
      <h3 data-t="s_versions"></h3>
      <label class="radio"><input type="radio" name="pin" value="" id="pin-auto"><span></span><em data-t="s_auto"></em></label>
      <div class="muted indent" data-t="s_autoHint"></div>
      <ul class="builds" id="builds"></ul>
      <div class="row"><button class="btn small" id="install-file" data-t="s_installFile"></button></div>
      <div class="muted" data-t="s_dropHint"></div>
    </section>
    <section>
      <h3 data-t="s_about"></h3>
      <div class="muted" id="about"></div>
      <div class="row"><button class="link" id="open-data" data-t="s_openData"></button></div>
    </section>
  </div>
</aside>

<div class="dropzone" id="dropzone" hidden>
  <div class="dropzone-card"><div class="dropzone-title" data-t="dropTitle"></div><div class="muted" data-t="dropBody"></div></div>
</div>
<div class="toast" id="toast" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="e-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232A31"/><stop offset="1" stop-color="#12161A"/></linearGradient>
    <linearGradient id="e-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5453F"/><stop offset="1" stop-color="#AE2522"/></linearGradient>
    <radialGradient id="e-lens" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#A9DCFF"/><stop offset=".35" stop-color="#2F9BEA"/><stop offset="1" stop-color="#114E7E"/></radialGradient>
    <!-- the logo: a hand of cards, the front one a red Pokédex -->
    <symbol id="emblem" viewBox="0 0 512 512">
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#e-tile)"/>
      <g transform="rotate(-16 256 300)"><rect x="150" y="104" width="212" height="296" rx="24" fill="#323B45" stroke="#4A5562" stroke-width="6"/></g>
      <g transform="rotate(-5 256 300)"><rect x="150" y="104" width="212" height="296" rx="24" fill="#F2A33A" stroke="#B9741C" stroke-width="6"/></g>
      <g transform="rotate(9 256 300)">
        <rect x="150" y="100" width="212" height="300" rx="24" fill="url(#e-red)" stroke="#6E1513" stroke-width="6"/>
        <circle cx="196" cy="146" r="30" fill="#F4F1EA"/><circle cx="196" cy="146" r="22" fill="url(#e-lens)"/><ellipse cx="188" cy="137" rx="7" ry="5" fill="#fff" transform="rotate(-30 188 137)"/>
        <circle cx="246" cy="134" r="7" fill="#FF7A6E"/><circle cx="268" cy="134" r="7" fill="#FFD65A"/><circle cx="290" cy="134" r="7" fill="#5BE08E"/>
        <rect x="174" y="196" width="164" height="176" rx="14" fill="#E8E2D2"/>
        <rect x="188" y="210" width="136" height="148" rx="8" fill="#0D2420"/>
        <path d="M262 226 236 286h22l-12 56 42-70h-24l14-46Z" fill="#BDF5DA"/>
      </g>
    </symbol>
  </defs>
</svg>

<script src="i18n.js"></script>
<script src="launcher.js"></script>
</body>
</html>
