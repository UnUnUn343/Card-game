name: Game release
# Publishing a GitHub release with the game's .html (or .zip) attached is all it takes.
# This job adds the compressed build and latest.json to that release, and every launcher
# picks the new version up on its next check (at start-up and every 30 minutes).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-game:
    if: ${{ !startsWith(github.event.release.tag_name, 'launcher-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add latest.json to the release
        run: node scripts/release.js ci-game --repo "$GITHUB_REPOSITORY" --tag "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      # GitHub otherwise picks "Latest" by date AND version number, and a vNNN tag outranks
      # launcher-vX.Y.Z, so creating a draft can make an older release "Latest". Launchers read
      # latest.json from whichever release is Latest, so pin it to the one just published.
      - name: Mark as the latest release
        if: ${{ !github.event.release.prerelease }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
